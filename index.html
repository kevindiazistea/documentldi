<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mi perfil · worldsync</title>
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body data-activo="perfil" data-migas='[["Consultor"],["Mi perfil"]]'>

  <main class="container">

    <section class="cabecera">
      <div class="cabecera-banner"></div>
      <div class="cabecera-cuerpo">
        <div class="cabecera-avatar" id="avatarGrande">
          <span id="avatarIniciales">?</span>
          <button class="mas" data-abrir="perfil" aria-label="Editar perfil">+</button>
        </div>
        <div class="cabecera-datos">
          <h1 id="perfilNombre"></h1>
          <p id="perfilPuesto"></p>
          <div class="pildoras" id="perfilPildoras"></div>
          <div class="pestanas" role="tablist">
            <button class="activa" role="tab" aria-selected="true">Resumen</button>
            <button role="tab" data-abrir="perfil">Editar perfil</button>
          </div>
        </div>
      </div>
    </section>

    <section class="metricas" id="metricas"></section>

    <div class="barra-lista">
      <h2>Módulos</h2>
      <span class="ayuda" style="margin:0">Endpoints armados con el cliente en curso</span>
    </div>
    <div class="grilla-modulos" id="grillaModulos"></div>

    <div class="barra-lista" style="margin-top:28px">
      <h2>Entrega</h2>
    </div>
    <div class="grilla-modulos">
      <a class="tarjeta-modulo" href="mails.html">
        <span class="tm-icono" id="iconoMails"></span>
        <h3>Mails</h3>
        <p>Un mail por módulo, listo para copiar y pegar en tu correo, con tu firma.</p>
      </a>
    </div>

  </main>

  <script src="js/comun.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/modulos.js"></script>
  <script src="js/perfil.js"></script>
</body>
</html>
