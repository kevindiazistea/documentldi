<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Detalle de búsqueda · worldsync</title>
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body data-activo="ldi" data-migas='[["Módulos"],["Listas de Informados","modulo.html?id=ldi"],["Informe de fuentes","informe.html"],["Detalle"]]'>

  

  <main class="container">

    <div class="encabezado">
      <div>
        <h1 id="tituloBusqueda">Búsqueda</h1>
        <p>Detalle de las fuentes que incluye esta búsqueda.</p>
      </div>
      <a class="btn btn-sec" id="btnEditar" href="#">Editar búsqueda</a>
    </div>

    <section class="caja">
      <div class="resumen" id="resumen"></div>
      <div class="barra-grande" id="barraGrande"></div>

      <div class="tabla-wrap">
        <table class="tabla">
          <thead>
            <tr><th>Fuente</th><th>País</th><th>Tipo</th><th>Código</th></tr>
          </thead>
          <tbody id="fuentesSeleccionadas"></tbody>
        </table>
      </div>
    </section>

  </main>

  <div class="barra-acciones">
    <div class="barra-acciones-in">
      <span class="estado">Cliente: <b id="clienteActual"></b></span>
      <a class="btn btn-sec" href="informe.html">Volver</a>
      <button class="btn" onclick="generarDocumento()">Generar PDF</button>
    </div>
  </div>

  <script src="libs/pdfmake/pdfmake.min.js"></script>
  <script src="libs/pdfmake/vfs_fonts.js"></script>
  <script src="js/comun.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/logo.js"></script>
  <script src="js/pdf.js"></script>
  <script src="js/ver.js"></script>

</body>
</html>
